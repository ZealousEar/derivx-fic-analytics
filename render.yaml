# Render Blueprint: builds the Dockerfile (runtime stage) and checks Streamlit's
# health endpoint. XSRF and CORS protection stay on (.streamlit/config.toml).
services:
  - type: web
    name: derivx
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_stcore/health
    envVars:
      - key: PORT
        value: 8501
      - key: STREAMLIT_SERVER_PORT
        value: 8501
      - key: STREAMLIT_SERVER_ADDRESS
        value: 0.0.0.0
      - key: STREAMLIT_CLIENT_SHOW_ERROR_DETAILS
        value: type
