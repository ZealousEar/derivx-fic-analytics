[build-system]
# >= 77 for the PEP 639 license expression below: setuptools deprecates the old license table and
# License classifiers, and stops supporting them after 2027-02-18.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "derivx"
version = "2.0.0"
description = "Derivatives analytics platform (FIC): BS, SVI/SABR, term structure, Black IR, DV01/PV01"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Farhad" }
]
keywords = [
  "term structure",
  "OIS",
  "IRS",
  "bootstrapping",
  "Black IR",
  "SABR",
  "SVI",
  "DV01",
  "PV01",
  "Greeks",
  "Monte Carlo",
  "calibration",
  "no-arbitrage"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent"
]
# Runtime dependencies. requirements.txt repeats this list (tests/test_deploy.py
# checks they agree) and requirements-lock.txt pins one tested resolution for
# the Docker image. Lower bounds are the oldest versions CI has run the suite
# on; upper bounds stop at the next major release, except numpy < 2.5: numpy
# 2.5 deprecates datetime arithmetic without a unit, which pandas 2.x does
# internally (DeprecationWarnings in concat), and pandas 3 is not supported
# yet. Every range has wheels for CPython 3.10-3.13 (on 3.10 pip picks
# Streamlit 1.65 and SciPy 1.15, the last releases that support it).
dependencies = [
  "numpy>=1.26,<2.5",
  "scipy>=1.11,<2",
  "pandas>=2.1,<3",
  "pyarrow>=14",
  "plotly>=5.22,<8",
  "streamlit>=1.59,<2",
  "yfinance>=0.2.66,<2"
]

[project.scripts]
derivx = "derivx.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  # Reference oracle for the golden fixtures (tools/gen_golden.py) and the live
  # checks; pinned because calendars and engines change between releases.
  "QuantLib==1.44",
  "black>=24",
  "ruff==0.17.1",
  # Pinned like ruff: a new mypy release adds checks, so CI only changes when this does.
  "mypy==2.4.0",
  # tests/test_collect_workflow.py parses the GitHub workflow files
  "PyYAML>=6,<7"
]
notebooks = [
  "matplotlib>=3.8,<4",
  "ipykernel>=6.29",
  "nbmake>=1.5,<2"
]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312", "py313"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".worktrees"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

# A lenient start: CI type-checks the package against the Docker lock's versions
# (requirements-lock.txt) and fails on any error code not switched off here.
# What stays on: undefined names, wrong argument names or counts in calls,
# redefinitions, missing annotations where mypy cannot infer a type, bad
# overrides, missing returns and, outside the modules listed below, unknown
# attributes. What is off for now: codes that mostly flag loose annotations,
# not bugs (numpy arrays passed as Sequence[float], Streamlit's Optional widget
# returns, values of heterogeneous dicts typed as object, pandas without
# stubs). Turn them on one at a time as the code is annotated.
[tool.mypy]
python_version = "3.10"
files = ["src/derivx"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disable_error_code = [
  "arg-type",
  "assignment",
  "call-overload",
  "dict-item",
  "index",
  "list-item",
  "misc",
  "operator",
  "return-value",
  "type-var",
  "union-attr",
]

# Modules whose duck-typed instruments and Dict[str, object] results still
# trip attr-defined (about 110 errors, none of them a missing attribute at
# run time); new modules are checked for it.
[[tool.mypy.overrides]]
module = [
  "derivx.cli",
  "derivx.data.rates_history",
  "derivx.rates.curve_io",
  "derivx.rates.curve_models",
  "derivx.rates.curves",
  "derivx.rates.exports",
  "derivx.rates.manifest",
  "derivx.rates.multicurve",
  "derivx.rates.portfolio",
  "derivx.rates.swaptions",
  "derivx.risk.scenarios",
  "derivx.risk.sensitivities",
  "derivx.ui.rates_bonds",
  "derivx.ui.rates_capfloor",
  "derivx.ui.rates_risk",
  "derivx.ui.rates_scenarios",
  "derivx.ui.rates_swap",
  "derivx.ui.rates_swaption",
]
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
