name: collect-data

# Saves each trading session's option chain (default SPY) on the data-snapshots branch.
#
# Yahoo Finance serves only the current chain, so a real walk-forward history exists only if every
# session is saved on its own day. Each run executes `derivx snapshots collect` (src/derivx/data/snapshots.py)
# into a staging directory, then copies the new files onto the orphan branch data-snapshots (created on
# the first run that saves something), appends options/index.csv and pushes as github-actions[bot] with
# GITHUB_TOKEN. Layout: options/<TICKER>/<YYYY>/<TICKER>_<session>.csv.gz plus a JSON manifest per file.
# `derivx snapshots sync`, the ANALYTICS lab and tools/compute_metrics.py --history read that branch.
#
# Schedule, in UTC: 21:35 Monday to Friday, which is 17:35 New York in summer (EDT, UTC-4) and 16:35 in
# winter (EST, UTC-5), so after the 16:15 options close in both. GitHub can start a scheduled run late;
# the collector takes the session that closed 10 minutes to 12 hours before the run and fetches nothing on
# a weekend, an NYSE holiday (src/derivx/data/calendar.py) or during a session, so those runs make no commit.
# Scheduled workflows run only from the default branch: collection starts once this file is on main.
#
# Failures: every Yahoo request retries with backoff and the whole chain is fetched up to 3 times (1 and
# then 2 minutes apart). A partial chain or one of another session is never written, and a session already
# on the branch is never fetched or rewritten again. The job summary says what happened and why. The job
# fails only when a trading day produced nothing for some ticker (after any complete files of the other
# tickers are committed), so a missed day shows red.
#
# The 60-day rule: GitHub disables the schedules of a public repository with no activity for 60 days. The
# data commits on trading days are repository activity; GitHub does not document whether pushes to a branch
# other than the default one reset that clock, so, as in keep-alive.yml, the last step re-enables this
# workflow on every scheduled run.

on:
  schedule:
    - cron: "35 21 * * 1-5"  # UTC: 17:35 EDT / 16:35 EST, Monday-Friday
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers to collect, comma-separated"
        required: false
        default: "SPY"
        type: string
      dry_run:
        description: "Dry run: collect and summarise only (no commit, no push)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: collect-data
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # push to data-snapshots
      actions: write  # only for re-enabling this workflow's schedule
    env:
      DATA_BRANCH: data-snapshots
      # Inputs reach the scripts through the environment, never spliced into them; the CLI validates tickers.
      TICKERS: ${{ inputs.tickers || 'SPY' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - name: Check out the code (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: code

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/requirements-lock.txt

      - name: Install the locked runtime dependencies and the package
        working-directory: code
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .

      - name: Check out data-snapshots in a separate path (an empty orphan branch on the first run)
        working-directory: code
        run: |
          set +e
          git ls-remote --exit-code --heads origin "refs/heads/$DATA_BRANCH" > /dev/null
          found=$?
          set -e
          if [ "$found" -eq 0 ]; then
            git fetch --no-tags --depth=1 origin "$DATA_BRANCH"
            git worktree add -B "$DATA_BRANCH" ../store FETCH_HEAD
            echo "data-snapshots: $(git -C ../store log -1 --format='%h %s')"
          elif [ "$found" -eq 2 ]; then
            git worktree add --detach ../store
            git -C ../store checkout -q --orphan "$DATA_BRANCH"
            git -C ../store rm -r -q -f .
            echo "data-snapshots does not exist yet: it is created as an orphan branch when a session is saved"
          else
            echo "::error::could not list the branches of origin (git ls-remote exit $found)"
            exit 1
          fi

      - name: Collect the due session's chain into a staging store
        id: collect
        working-directory: code
        run: |
          args=(--tickers "$TICKERS" --staging ../staging --store ../store
                --summary "$GITHUB_STEP_SUMMARY" --report ../collect-report.json)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          set +e
          python -m derivx snapshots collect "${args[@]}"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0: saved, already on the branch, or no session due; 1: a trading day produced nothing for some
          # ticker (the job fails after the commit step); anything else is a broken run: fail now.
          if [ "$code" -gt 1 ]; then exit "$code"; fi

      - name: Copy the new files onto data-snapshots, append the index, commit and push
        if: env.DRY_RUN != 'true'
        working-directory: store
        run: |
          # publish: merge the staged files, check the index, commit; prints the sessions added.
          # Returns 1 when there is nothing new to commit, 2 on any error.
          publish() {
            (cd ../code && python -m derivx snapshots merge ../staging ../store) >&2 || return 2
            (cd ../code && python -m derivx snapshots index --store ../store --check) >&2 || return 2
            git add -A || return 2
            if git diff --cached --quiet; then
              return 1
            fi
            sessions=$(git diff --cached --name-only --diff-filter=A -- 'options/*.csv.gz' \
              | sed -e 's|.*/||' -e 's|\.csv\.gz$||' | tr '\n' ' ')
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -q -m "data: option chains ${sessions% }" \
                -m "Collected by collect-data.yml run ${GITHUB_RUN_ID} from ${GITHUB_SHA}." >&2 || return 2
            echo "${sessions% }"
          }
          for attempt in 1 2 3; do
            set +e
            added=$(publish)
            status=$?
            set -e
            if [ "$status" -eq 1 ]; then
              echo "Nothing new to commit on $DATA_BRANCH." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            elif [ "$status" -ne 0 ]; then
              echo "::error::the staged snapshots could not be merged into $DATA_BRANCH (see the log)"
              exit 1
            fi
            if git push -q origin "HEAD:refs/heads/$DATA_BRANCH"; then
              echo "Pushed to $DATA_BRANCH: $added ($(git log -1 --format=%h))." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "push rejected (attempt $attempt): rebuilding the commit on the branch's new tip"
            sleep $((attempt * 10))
            git fetch --no-tags --depth=1 origin "$DATA_BRANCH"
            git reset -q --hard FETCH_HEAD
          done
          echo "::error::could not push to $DATA_BRANCH after 3 attempts"
          exit 1

      - name: Fail when a trading day produced nothing
        if: steps.collect.outputs.code == '1'
        run: |
          echo "::error::a due session could not be collected for some ticker: see the job summary"
          exit 1

      - name: Keep the schedule enabled (no commits)
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable collect-data.yml --repo "$GITHUB_REPOSITORY"
