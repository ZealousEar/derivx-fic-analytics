name: keep-alive

# Wakes the Streamlit Community Cloud app and fails when it is down.
#
# A plain HTTP check cannot fail: the live app and a nonexistent
# *.streamlit.app both answer 303 to share.streamlit.io's auth page. Only a
# real browser follows that redirect, opens the app's websocket (the traffic
# that keeps a Community Cloud app awake) and can see whether the app's own UI
# renders. tools/keep_alive/main.py drives headless Chrome, clicks the wake
# button when the app sleeps and exits 1 unless the app's sidebar appears, so a
# red run here means the app is really down.
#
# No commits: GitHub disables scheduled workflows in a repository with no
# activity for 60 days. Instead of pushing a timestamp file (which filled the
# history with bot commits), the last step re-enables this workflow through
# the API on every scheduled run. If GitHub ever stops counting that, the
# schedule is disabled after 60 quiet days and GitHub emails the owner; one
# click on "Enable workflow" (or `gh workflow enable keep-alive.yml`)
# restores it. Either way no run reports "alive" for an app that is down.
#
# collect-data.yml now adds a data commit to the data-snapshots branch every
# trading day, which is repository activity too. That does not make this
# workflow redundant: it is the only check that the hosted app is up, and it
# keeps its own re-enable step because GitHub does not document whether
# activity on a branch other than the default one counts for the 60 days.

on:
  schedule:
    - cron: "17 */6 * * *"  # every 6 hours, off the top of the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write  # only for re-enabling this workflow's schedule
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/keep_alive/requirements.txt

      - name: Install Selenium
        run: python -m pip install -r tools/keep_alive/requirements.txt

      # ubuntu-latest ships Google Chrome; Selenium Manager (Selenium >= 4.6)
      # downloads the chromedriver that matches it.
      - name: Wake the app and check that it renders
        env:
          STREAMLIT_APP_URL: https://derivx.streamlit.app/
          STREAMLIT_APP_MARKER: NAVIGATION
          STREAMLIT_WAKE_TIMEOUT: "300"
        run: python tools/keep_alive/main.py

      - name: Keep the schedule enabled (no commits)
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable keep-alive.yml --repo "$GITHUB_REPOSITORY"
